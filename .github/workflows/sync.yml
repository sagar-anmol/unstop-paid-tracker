name: Sync Unstop Paid Registrations (Manual Only - Auto-Sync Stopped)

# CRON AUTO-SYNC STOPPED:
# Automatic scheduled sync has been disabled per user request.
# Unstop payments have been refunded and registrations are transitioning to techfest26.in.
# To prevent Unstop from repeatedly marking participants as 'paid', automatic cron is disabled.

on:
  workflow_dispatch:
    inputs:
      unstop_token:
        description: 'Fresh Unstop Bearer Token (optional override)'
        required: false
        default: ''
      unstop_cookies:
        description: 'Fresh Unstop Cookies (optional override)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and Filter Paid Registrations
        env:
          UNSTOP_API_URL: ${{ secrets.UNSTOP_API_URL }}
          UNSTOP_EMAIL: ${{ secrets.UNSTOP_EMAIL }}
          UNSTOP_PASSWORD: ${{ secrets.UNSTOP_PASSWORD }}
          UNSTOP_TOKEN: ${{ github.event.inputs.unstop_token != '' && github.event.inputs.unstop_token || secrets.UNSTOP_TOKEN }}
          UNSTOP_COOKIES: ${{ github.event.inputs.unstop_cookies != '' && github.event.inputs.unstop_cookies || secrets.UNSTOP_COOKIES }}
          UNSTOP_ACCOUNT_ID: ${{ secrets.UNSTOP_ACCOUNT_ID }}
        run: |
          python scripts/fetch_registrations.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ data.json
          if git diff --staged --quiet; then
            echo "No changes in registration data."
          else
            git commit -m "chore(data): manual sync unstop registrations [skip ci]"
            git push
          fi

      - name: Write summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open('data/summary.json') as fh:
              s = json.load(fh)
          print("### Unstop registration sync")
          print("")
          print(f"- Registrations: **{s.get('total_unstop_registrations', 0)}**")
          print(f"- Refunded: **{s.get('total_refunded_registrations', 0)}**")
          print(f"- Cancelled: **{s.get('total_cancelled_registrations', 0)}**")
          print(f"- Awaiting payment: **{s.get('total_unpaid_registrations', 0)}**")
          print(f"- Events scanned: **{s.get('total_events_scanned', 0)}**")
          print(f"- Colleges: **{s.get('total_colleges', 0)}**")
          print(f"- Last synced: `{s.get('last_synced_at', 'n/a')}`")
          PY
